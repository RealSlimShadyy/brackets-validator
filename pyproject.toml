[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
# Назва на (Test)PyPI має бути унікальною! Замініть "yourname" на свій нік.
name = "brackets-validatorlyubomyr"
version = "0.1.0"
description = "Валідатор балансу дужок (), {}, <> з підсвічуванням помилок"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
authors = [{ name = "Sw1tch", email = "larkty212@gmail.com" }]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]

[project.scripts]
brackets-validator = "brackets_validator.cli:main"

[project.urls]
Homepage = "https://github.com/yourname/brackets-validator"

[tool.hatch.build.targets.wheel]
packages = ["src/brackets_validator"]
